name: Publish homepage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check source
        run: python3 scripts/check-seo.py
      - name: Package public files
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build-pages.py --site-url "$SITE_URL"
      - name: Check published metadata and links
        working-directory: _site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 ../scripts/check-seo.py --site-url "$SITE_URL"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
