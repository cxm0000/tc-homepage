<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60" role="img" aria-labelledby="cm-logo-title cm-logo-desc">
  <title id="cm-logo-title">CareMetrics</title>
  <desc id="cm-logo-desc">CareMetrics logo for light backgrounds</desc>

  <!-- Icon block (inspired by Stitch design) -->
  <g transform="translate(10,10)">
    <!-- Outer square outline -->
    <rect x="0" y="0" width="36" height="36" rx="4"
          fill="none"
          stroke="#0F172A"
          stroke-width="2" />

    <!-- Overlapping teal square -->
    <rect x="14" y="14" width="36" height="36" rx="4"
          fill="#14B8A6"
          fill-opacity="0.7" />

    <!-- Soft navy background square -->
    <rect x="8" y="8" width="36" height="36" rx="4"
          fill="#0F172A"
          fill-opacity="0.08" />

    <!-- Central analytics dot -->
    <circle cx="26" cy="26" r="4.5" fill="#14B8A6" />
  </g>

  <!-- Wordmark: CareMetrics as one word for light background -->
  <g transform="translate(64,38)">
    <text x="0" y="0"
          font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22"
          font-weight="700"
          letter-spacing="-0.04em">
      <tspan fill="#0F172A">Care</tspan><tspan fill="#14B8A6">Metrics</tspan>
    </text>
  </g>
</svg>
